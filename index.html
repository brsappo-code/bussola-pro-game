<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bússola PRO</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 id="user-name">Carregando...</h1>
      <div class="badge" id="estacao-badge">Inverno</div>
    </header>

    <main class="content">
      <!-- Card do Avatar / Biotipo -->
      <section class="card avatar-card">
        <div class="avatar-container">
          <div id="avatar-icon">🏃</div>
        </div>
        <div class="avatar-info">
          <p><strong>Biótipo:</strong> <span id="user-biotipo">Mesomorfo</span></p>
          <p><strong>Silhueta:</strong> <span id="user-silhueta">Nível 1</span></p>
        </div>
      </section>

      <!-- Card do Pedómetro (Passos) -->
      <section class="card steps-card">
        <h2>Passos de Hoje</h2>
        <div class="steps-count" id="steps-display">0</div>
        <p class="steps-goal">Meta: 6.000 passos</p>
        <button id="sensor-btn" class="btn-primary">Ativar Acelerómetro</button>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
