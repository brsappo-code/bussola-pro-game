<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bússola PRO - Método Groppo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- HUD / HEADER DE JOGO -->
        <header class="hud-header">
            <div class="user-info">
                <span id="user-name">Aventureiro</span>
                <span id="user-plan" class="badge-free">FREE</span>
            </div>
            <div class="prana-container">
                <span class="prana-icon">✨</span>
                <span id="prana-counter">0</span> <small>Prana</small>
            </div>
        </header>

        <!-- CRIADOR DE PERSONAGEM & ANAMNESE -->
        <section id="character-creator" class="rpg-window">
            <div class="window-title">⚔️ CRIADOR DE PERSONAGEM ⚔️</div>
            <form id="onboarding-form">
                <label>Nome do Aventureiro:</label>
                <input type="text" id="input-nome" placeholder="Seu nome ou apelido" required>

                <div class="row-inputs">
                    <div>
                        <label>Gênero:</label>
                        <select id="input-genero">
                            <option value="MASCULINO">Masculino</option>
                            <option value="FEMININO">Feminino</option>
                        </select>
                    </div>
                    <div>
                        <label>Biotipo:</label>
                        <select id="input-biotipo">
                            <option value="Mesomorfo">Mesomorfo</option>
                            <option value="Ectomorfo">Ectomorfo</option>
                            <option value="Endomorfo">Endomorfo</option>
                        </select>
                    </div>
                </div>

                <div class="row-inputs">
                    <div>
                        <label>Altura (cm):</label>
                        <input type="number" id="input-altura" placeholder="175" required oninput="calcularBiometria()">
                    </div>
                    <div>
                        <label>Peso (kg):</label>
                        <input type="number" id="input-peso" placeholder="70" required oninput="calcularBiometria()">
                    </div>
                </div>

                <div class="biometric-box" id="biometric-preview">
                    📊 IMC: <span id="val-imc">--</span> | Biotipo: <span id="val-biotipo">Mesomorfo</span>
                </div>

                <label style="margin-top: 12px;">Silhueta Corporal (Escala 1 a 9): <strong id="silhueta-val">5</strong></label>
                <input type="range" id="input-silhueta" min="1" max="9" value="5">

                <button type="submit" class="btn-arcade" style="margin-top: 14px;">Confirmar Atributos e Iniciar Jornada</button>
            </form>
        </section>

        <!-- PAINEL PRINCIPAL DE JOGO (DASHBOARD) -->
        <section id="game-dashboard" class="rpg-window hidden">
            <div class="window-title">🗺️ MAPA DE JORNADA - MÉTODO GROPPO</div>
            
            <div class="biometric-box" style="margin-bottom: 12px;">
                <h3>👣 Passos de Hoje</h3>
                <div class="step-count" id="steps-display" style="font-size: 18px; font-weight: bold; color: #34d399; margin: 4px 0;">0 / 6000</div>
                <div class="progress-bar" style="background: #0b1329; border-radius: 4px; height: 10px; overflow: hidden; border: 1px solid #334155;">
                    <div id="steps-progress" style="background: #10b981; height: 100%; width: 0%;"></div>
                </div>
            </div>

            <!-- PORTAIS DAS ESTAÇÕES -->
            <div class="portals-container">
                <div id="portal-inverno" class="biometric-box locked" style="opacity: 0.5; margin-bottom: 8px;">
                    <h4>❄️ Portal do Inverno</h4>
                    <p style="font-size: 10px; color: #94a3b8;">Alongamento & Descompressão (Requer 1.500 passos)</p>
                </div>
                <div id="portal-outono" class="biometric-box locked" style="opacity: 0.5; margin-bottom: 8px;">
                    <h4>🍂 Portal do Outono</h4>
                    <p style="font-size: 10px;
